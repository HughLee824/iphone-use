name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Match the validated SDK and the image's iOS 27 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Report build toolchain
        run: |
          xcodebuild -version
          swift --version
      - run: swift test
      - name: Test the Runner event bridge with host runtime doubles
        run: |
          xcrun clang -fobjc-arc -framework Foundation -framework CoreGraphics \
            Runner/RunnerPinchEvent.m Tests/RunnerRuntime/PinchEventTests.m \
            -o .build/runner-pinch-runtime-tests
          .build/runner-pinch-runtime-tests
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: node --test scripts/tests/test_agent_templates.mjs
      - name: Compile the iPhone Runner without signing
        run: |
          xcodebuild build-for-testing \
            -project Runner/IPhoneUseRunner.xcodeproj -scheme IPhoneUseRunner \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ci-runner \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=17.0
      - name: Check and package the self-contained client plugin
        run: |
          python3 scripts/sync-plugin.py --check
          python3 scripts/sync-plugin.py --archive .build/plugins
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: client-plugins
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Explicit public paths below include .build/plugins.
          path: |
            .build/plugins/*.zip
            .build/plugins/*.zip.sha256
