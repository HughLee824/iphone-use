name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Match the validated SDK and the image's iOS 27 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Report build toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
      - name: Run shared engineering checks
        run: python3 scripts/check.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: client-plugins
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Explicit public paths below include .build/plugins.
          path: |
            .build/plugins/*.zip
            .build/plugins/*.zip.sha256
