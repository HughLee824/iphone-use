name: Publish DeepSeek Harness plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable Harness package version already merged into main'
        required: true
        type: string
      verify_only:
        description: 'Verify an existing publication without publishing (archive integrity must match)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-dsh-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'HughLee824/iphone-use' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      GH_TOKEN: ${{ github.token }}
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require successful main CI for this exact source commit
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=1 > "$RUNNER_TEMP/ci.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ci.json').read_text())['workflow_runs']
          if not runs or not all((
              runs[0]['head_sha'] == os.environ['GITHUB_SHA'],
              runs[0]['head_branch'] == 'main',
              runs[0]['status'] == 'completed',
              runs[0]['conclusion'] == 'success',
          )):
              raise SystemExit('The latest push CI for this main commit must finish successfully before publishing.')
          PY
      - name: Validate version and publication mode
        run: |
          if [ "$VERIFY_ONLY" = true ]; then
            python3 scripts/plugin/dsh-release.py check "$VERSION" --verify-only
          else
            python3 scripts/plugin/dsh-release.py check "$VERSION"
          fi
      - name: Check the source and plugin
        run: |
          python3 scripts/plugin/sync-plugin.py --check
          node --test scripts/tests/test_dsh_plugin.mjs
      - name: Build and smoke-test the exact publication archive
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/dsh-pack.json"
          npm install "$RUNNER_TEMP/dsh-iphone-use-$VERSION.tgz" --prefix "$RUNNER_TEMP/dsh-smoke" \
            --ignore-scripts --no-audit --no-fund --no-package-lock --offline
          node scripts/plugin/check-dsh-package.mjs "$RUNNER_TEMP/dsh-smoke/node_modules/dsh-iphone-use"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsh-plugin-package
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/dsh-iphone-use-*.tgz
            ${{ runner.temp }}/dsh-pack.json
      - name: Publish through npm OIDC trusted publishing
        if: ${{ !inputs.verify_only }}
        run: npm publish "$RUNNER_TEMP/dsh-iphone-use-$VERSION.tgz" --ignore-scripts --access public --provenance
      - name: Verify registry integrity and public installation
        run: python3 scripts/plugin/dsh-release.py verify "$RUNNER_TEMP/dsh-pack.json"
      - name: Record the published source
        run: |
          {
            if [ "$VERIFY_ONLY" = true ]; then
              echo "Verified existing dsh-iphone-use@$VERSION against source $GITHUB_SHA; no publication performed."
            else
              echo "Published dsh-iphone-use@$VERSION from $GITHUB_SHA."
            fi
            echo 'Registry integrity and public installation passed. Real Harness runtime and physical-device acceptance are recorded separately.'
          } >> "$GITHUB_STEP_SUMMARY"
