name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version without v (for example, 0.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package checks (no iPhone)
    if: github.repository == 'HughLee824/iphone-use' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Keep aligned with CI and the hosted image's iOS 27 simulator runtime.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Report build toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install SwiftLint
        run: python3 scripts/tools/install-swiftlint.py
      - name: Install Actionlint
        run: python3 scripts/tools/install-actionlint.py
      - name: Run shared engineering checks
        run: python3 scripts/check.py
      - name: Validate and package the client plugin
        run: |
          python3 scripts/plugin/sync-plugin.py --check
          python3 scripts/plugin/sync-plugin.py --archive .build/releases
      - name: Build and verify the exact archive
        run: |
          python3 scripts/release/build-release.py --version "$VERSION" --require-clean
          python3 scripts/release/verify-release.py ".build/releases/iphone-use-${VERSION}-macos-arm64.tar.gz" --require-clean
      - name: Verify Homebrew installation preserves the CLI and Runner
        run: |
          python3 scripts/release/generate-homebrew.py ".build/releases/iphone-use-${VERSION}-macos-arm64.tar.gz" --local --output "$RUNNER_TEMP/iphone-use.rb"
          ruby -c "$RUNNER_TEMP/iphone-use.rb"
          brew tap-new iphone-use/acceptance
          cp "$RUNNER_TEMP/iphone-use.rb" "$(brew --repository iphone-use/acceptance)/Formula/iphone-use.rb"
          brew install iphone-use/acceptance/iphone-use
          brew test iphone-use/acceptance/iphone-use
      - name: Generate the public formula
        run: python3 scripts/release/generate-homebrew.py ".build/releases/iphone-use-${VERSION}-macos-arm64.tar.gz" --output .build/releases/iphone-use.rb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true # Only the validated release files listed below.
          path: |
            .build/releases/*.tar.gz
            .build/releases/*.tar.gz.sha256
            .build/releases/iphone-use.rb
            .build/releases/*.zip
            .build/releases/*.zip.sha256

  draft:
    name: Create draft (local device acceptance pending)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Check downloaded artifacts and refuse an existing tag
        run: |
          python3 scripts/release/verify-release.py "release-assets/iphone-use-${VERSION}-macos-arm64.tar.gz" --require-clean --no-execute > "$RUNNER_TEMP/verified-release.json"
          python3 scripts/release/generate-homebrew.py "release-assets/iphone-use-${VERSION}-macos-arm64.tar.gz" --output "$RUNNER_TEMP/iphone-use.rb"
          cmp "$RUNNER_TEMP/iphone-use.rb" release-assets/iphone-use.rb
          python3 scripts/plugin/sync-plugin.py --archive "$RUNNER_TEMP/plugins"
          cmp "$RUNNER_TEMP/plugins/"*.zip release-assets/iphone-use-plugin-*.zip
          cmp "$RUNNER_TEMP/plugins/"*.zip.sha256 release-assets/iphone-use-plugin-*.zip.sha256
          existing=$(git ls-remote --tags origin "refs/tags/v${VERSION}")
          if [ -n "$existing" ]; then
            echo 'This tag already exists; use a new release version.' >&2
            exit 1
          fi
      - name: Create a draft with all assets attached
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/release-notes.md"
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'verified-release.json').read_text())
          if release['version'] != os.environ['VERSION'] or release['sourceCommit'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('The verified archive must match this workflow version and source commit.')
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          print('Precompiled macOS CLI and iOS Runner for Apple Silicon, under the MIT license.\n')
          print('## Build\n')
          print(f"- Version: `{release['version']}`")
          print(f"- Source commit: `{release['sourceCommit']}`")
          print(f"- Archive: `iphone-use-{release['version']}-macos-{release['architecture']}.tar.gz`")
          print(f"- Archive SHA-256: `{release['sha256']}`")
          print(f"- Automated checks: [GitHub Actions]({run_url}) (attempt {os.environ['GITHUB_RUN_ATTEMPT']})\n")
          PY
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Changes

          Pending: describe this version's changes, compatibility changes and upgrade steps.

          ## Automated checks — passed

          - Swift, Python, and Node call-template tests.
          - Self-contained Codex/Claude Code plugin, matching manifests and source skill, with ZIP and SHA-256.
          - Archive integrity, relocated CLI version/help commands and Mac code signature verification.
          - Homebrew installation and installed CLI/Runner file digests.

          These checks ran on GitHub-hosted machines without a physical iPhone. They did not run device setup, connect to a phone or verify an app task.

          ## Local device acceptance — pending

          Maintainer / date: pending.
          Environment (Mac architecture, macOS, Xcode, iPhone model, iOS, signing type): pending.

          - [ ] Downloaded this draft's archive and matched its version, source commit and SHA-256 above.
          - [ ] Installed the complete package outside the source checkout and used its CLI for all device checks.
          - [ ] Standard mode connected without Runner setup; observe, an input action, visible verification and disconnect passed.
          - [ ] Explicit Runner mode setup completed without compilation; connect, observe and disconnect passed.
          - [ ] Repeated setup and upgrade from the previous release passed. For the first release, record upgrade as not applicable.
          - [ ] An app task passed by checking the saved result, including explicit non-default values where applicable.

          Task, expected/actual result, upgrade result and remaining limitations: pending.
          Follow docs/release-setup.md on the maintainer's local Mac with a connected iPhone. Record the results before changing this section to passed and publishing. Keep profiles, device identifiers and private screenshots/logs local.

          ## Installation

          Download the tar.gz and its .sha256 file together. Installation and iPhone setup instructions are in the package README and repository docs/install.md. The separate iphone-use-plugin ZIP contains Codex/Claude manifests, the DeepSeek Harness bundle, and the complete skill; it does not contain the CLI or signed Runner. Follow docs/plugins.md for each client installation path and docs/first-task.md for the first iPhone task.

          Both modes require full Xcode. Standard mode currently requires macOS/iOS 27 and does not need Runner setup or development signing. Optional Runner mode requires your own Apple development certificate, private key and matching provisioning profile; setup re-signs the precompiled Runner locally. Free Personal Team onboarding and renewal are not yet validated. The Mac CLI is ad-hoc signed, without Developer ID signing or notarization.

          Maintainer: publish the exact archive accepted locally. After a stable release is published, run the Homebrew Tap's Update iPhone-use workflow with the same version, then verify installation from the public download URL and Tap. Prereleases use manual installation. The attached iphone-use.rb contains the exact versioned download URL and archive checksum.
          EOF
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" release-assets/* --target "$SOURCE_COMMIT" --draft "${flags[@]}" --title "iPhone-use ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
