version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /scripts/brand
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
  - package-ecosystem: pip
    directory: /scripts/brand
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
